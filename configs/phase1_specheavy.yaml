# Phase 1 — spec-decode-heavy mix: coding class dominates so n-gram prompt-lookup lands often.
# Expect a markedly higher acceptance_rate than the other mixes.
model: Qwen/Qwen2.5-1.5B-Instruct

server:
  base_url: http://localhost:8000
  dtype: float16

workload:
  duration_s: 90
  warmup_s: 30
  repeats: 3
  seed: 12345
  arrival_rates: [1, 2, 4]
  save_raw: false
  mix:
    coding: 0.8        # spec-decode class
    short: 0.2

telemetry:
  interval_s: 0.5
  gpu_index: 0

slo:
  ttft_ms: 1000
  tpot_ms: 50
