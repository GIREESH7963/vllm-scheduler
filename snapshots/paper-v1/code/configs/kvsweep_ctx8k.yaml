# KV-regime sweep — point 2 of 4: ~8k-token context (approaching the crossover).
# See kvsweep_ctx2k.yaml for the design; only prompt length and arrival rate change across points.
model: Qwen/Qwen2.5-1.5B-Instruct

server:
  base_url: http://localhost:8000
  dtype: float16

workload:
  duration_s: 80
  warmup_s: 25
  repeats: 2
  seed: 12345
  arrival_rates: [1.0]        # lower capacity at 8k -> lower saturating rate
  save_raw: false
  mix:
    longctx: 1.0
  profiles:
    longctx:
      prompt_len: {kind: fixed, lo: 6150}    # ~8k tokens
      output_len: {kind: fixed, lo: 96}
      corpus: prose

telemetry:
  interval_s: 0.5
  gpu_index: 0
  cooldown_c: 77

slo:
  ttft_ms: 5000
  tpot_ms: 125
